name: API Release Prep

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-release.yml"

jobs:
  build-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Build API image
        run: docker build -t fullstack-devops-lab-api:${{ github.sha }} .