name: API CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Build API image
        run: docker build -t fullstack-devops-lab-api .